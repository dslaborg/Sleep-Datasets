# config expected by `preprocess.py`; same as `preprocess.yaml` but uses the `dataset_w_emg` configs, which
# additionally extract the emg channels where available. drop a line to exclude a dataset.
defaults:
  - base_config@_global_
  - dataset_w_emg/abc@datasets.abc
  - dataset_w_emg/ccshs@datasets.ccshs
  - dataset_w_emg/cfs@datasets.cfs
  - dataset_w_emg/chat@datasets.chat
  - dataset_w_emg/dcsm@datasets.dcsm
  - dataset_w_emg/dodh@datasets.dodh
  - dataset_w_emg/dodo@datasets.dodo
  - dataset_w_emg/hpap@datasets.hpap
  - dataset_w_emg/isruc-sg1@datasets.isruc-sg1
  - dataset_w_emg/isruc-sg2@datasets.isruc-sg2
  - dataset_w_emg/isruc-sg3@datasets.isruc-sg3
  - dataset_w_emg/mass-c1@datasets.mass-c1
  - dataset_w_emg/mass-c3@datasets.mass-c3
  - dataset_w_emg/mesa@datasets.mesa
  - dataset_w_emg/mros@datasets.mros
  - dataset_w_emg/phys@datasets.phys
  - dataset_w_emg/sedf-sc@datasets.sedf-sc
  - dataset_w_emg/sedf-st@datasets.sedf-st
  - dataset_w_emg/shhs@datasets.shhs
  - dataset_w_emg/sof@datasets.sof
  - dataset_w_emg/svuh@datasets.svuh
  - _self_

save_file: "${general.save_dir}/preprocessed/processed_data.h5"  # where to write the combined output h5 (must not exist)
num_threads: 20  # number of threads used to preprocess the recordings in parallel
strip_func:
  strip_func: strip_to_match  # strips the psg/hypnogram to the common (overlapping) span of the two
filter_settings: {}  # bandpass filter settings; empty means no filtering (see preprocess_with_filtering.yaml)
quality_control_func:
  quality_control_func: "clip_noisy_values"  # clip values that are far out of the global iqr range
  min_max_times_global_iqr: 20  # values beyond 20x the global iqr range are clipped
scaler: "RobustScaler"  # scaler used to normalize the signals
