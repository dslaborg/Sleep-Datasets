general:
  sample_rate: 128
  epoch_duration: 30
  stages:
    9: UNKNOWN
    0: Wake
    1: N1
    2: N2
    3: N3
    4: REM
  rstages:
    W: 0
    Wake: 0
    N1: 1
    N2: 2
    N3: 3
    REM: 4
    Unknown: 9
    Sleep stage W: 0
    Sleep stage 1: 1
    Sleep stage 2: 2
    Sleep stage 3: 3
    Sleep stage R: 4
    Sleep stage ?: 9
    R: 4
    UNKNOWN: 9
    Sleep stage 4: 3
    Movement time: 9
  base_dir: /mnt/sleep/sleep_data
  save_dir: /mnt/sleep/sleep_data/cache_fixed
name: dodh
use_dir_names: false
bad_recordings:
- preparations
psg:
  file_glob: dreem/dodh/*.h5
  eeg_channels:
  - C3_M2
  - F4_M1
  - F3_F4
  - F3_M2
  - F4_O2
  - F3_O1
  - FP1_F3
  - FP1_M2
  - FP1_O1
  - FP2_F4
  - FP2_M1
  - FP2_O2
  eog_channels:
  - EOG1
  - EOG2
  renamed_eeg_channels:
  - C3-M2
  - F4-M1
  - F3-F4
  - F3-M2
  - F4-O2
  - F3-O1
  - FP1-F3
  - FP1-M2
  - FP1-O1
  - FP2-F4
  - FP2-M1
  - FP2-O2
  renamed_eog_channels:
  - EOG1
  - EOG2
  id_regex: (.*)
  extractor:
    _target_: utils.extract_psg_utils.dod_extract
hypno:
  file_glob: cache/${name}/preparations/goldstandards/*.npy
  extract_func: null
  id_regex: (.*)
  prepare_func:
    _target_: utils.extract_hypno_utils.prepare_gs_dreem
    dataset: ${name}
    file_dir: dreem/scorers/dodh/
    out_dir: cache/${name}/preparations/goldstandards/
  write_offsets_to_file: false
preprocessing:
  psg_regex: .*[.]h5
  hyp_regex: .*[.]ids
splitting:
  family_id_extractor: null
  subject_id_regex: null
  test_fraction: 1.0
  max_test_subjects: null
  validation_fraction: 0
  max_validation_subjects: null
