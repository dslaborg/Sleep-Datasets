  - EEG Fp1-CLE
  - EEG Fp2-CLE
  - EEG F3-LER
  - EEG F4-LER
  - EEG C3-LER
  - EEG C4-LER
  - EEG O1-LER
  - EEG O2-LER
  - EEG F7-LER
  - EEG F8-LER
  - EEG T3-LER
  - EEG T4-LER
  - EEG T5-LER
  - EEG T6-LER
  - EEG P3-LER
  - EEG P4-LER
  - EEG Fz-LER
  - EEG Cz-LER
  - EEG Pz-LER
  - EEG Fp1-LER
  - EEG Fp2-LER
