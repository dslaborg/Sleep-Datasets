hypno:
  file_glob: MASS/SS1_EDF/*Base.edf
  extract_func:
    _target_: utils.extract_hypno_utils.extract_from_edf
  id_regex: (.*) Base
  prepare_func: null
  write_offsets_to_file: true
preprocessing:
  psg_regex: .*[.]h5
  hyp_regex: .*[.]ids
splitting:
  family_id_extractor: null
  subject_id_regex: null
  test_fraction: 1.0
  max_test_subjects: null
  validation_fraction: 0
  max_validation_subjects: null
