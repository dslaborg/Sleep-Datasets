general:
  sample_rate: 128
  epoch_duration: 30
  stages:
    9: UNKNOWN
    0: Wake
    1: N1
    2: N2
    3: N3
    4: REM
  rstages:
    W: 0
    Wake: 0
    N1: 1
    N2: 2
    N3: 3
    REM: 4
    Unknown: 9
    '0': 0
    '1': 1
    '2': 2
    '3': 3
    '4': 4
    '9': 9
    Sleep stage W: 0
    Sleep stage 1: 1
    Sleep stage 2: 2
    Sleep stage 3: 3
    Sleep stage R: 4
    Sleep stage ?: 9
    R: 4
    UNKNOWN: 9
    Sleep stage 4: 3
    Movement time: 9
  base_dir: /mnt/sleep/sleep_data
  save_dir: /mnt/sleep/sleep_data/cache_w_emg
name: svuh
use_dir_names: false
bad_recordings: []
psg:
  file_glob: SVUH/physionet.org/files/ucddb/1.0.0/*.rec
  eeg_channels:
  - C3A2
  - C4A1
  eog_channels:
  - Lefteye
  - RightEye
  emg_channels:
  - EMG
  renamed_eeg_channels:
  - C3-A2
  - C4-A1
  renamed_eog_channels:
  - EOG(L)
  - EOG(R)
  renamed_emg_channels:
  - EMG
  id_regex: ucddb(.*)
  extractor:
    _target_: extract_psg.standard_extract
hypno:
  file_glob: SVUH/physionet.org/files/ucddb/1.0.0/*_stage.txt
  extract_func:
    _target_: utils.extract_hypno_utils.extract_from_txt
    stage_dict:
      '0': Wake
      '1': REM
      '2': N1
      '3': N2
      '4': N3
      '5': N3
      '6': UNKNOWN
      '7': UNKNOWN
      '8': UNKNOWN
  id_regex: ucddb(.*)_.*
  prepare_func: null
  write_offsets_to_file: false
preprocessing:
  psg_regex: .*[.]h5
  hyp_regex: .*[.]ids
splitting:
  family_id_extractor: null
  subject_id_regex: null
  test_fraction: 1.0
  max_test_subjects: null
  validation_fraction: 0
  max_validation_subjects: null
